<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Forge</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* Centered single-column layout — bypasses the rail since the user isn't
     authenticated yet. */
  body { display: grid; place-items: center; padding: 24px; }
  .auth {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 26px 24px;
    box-shadow: 0 20px 60px -24px rgba(0,0,0,0.6);
  }
  .auth__brand {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 22px;
  }
  .auth__brand-mark {
    font: 700 20px/1 var(--sans);
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .auth__brand-mark::after {
    content: ''; display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 3px rgba(126,181,116,0.20);
    margin-left: 6px;
    vertical-align: middle;
  }
  .auth__title {
    font: 700 20px/1.2 var(--sans);
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .auth__sub {
    font: 500 14.5px/1.5 var(--sans);
    color: var(--ink-3);
    margin-bottom: 22px;
  }
  .auth__field { margin-bottom: 14px; }
  .auth__field label {
    display: block;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .auth__field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 12px;
    font: 500 15.5px/1.4 var(--sans);
    outline: none;
  }
  .auth__field input:focus { border-color: var(--gold); }
  .auth__submit {
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 10px 16px;
    font: 600 15px/1 var(--sans);
    cursor: pointer;
    margin-top: 8px;
    transition: background 100ms ease;
  }
  .auth__submit:hover:not(:disabled) { background: var(--gold-2); }
  .auth__submit:disabled { opacity: 0.55; cursor: not-allowed; }
  .auth__error {
    font: 500 14px/1.4 var(--sans);
    color: var(--brick);
    margin-top: 10px;
    min-height: 18px;
  }
  .auth__hint {
    font: 500 12.5px/1.5 var(--sans);
    color: var(--ink-4);
    margin-top: 18px;
    text-align: center;
  }
  .auth__hint code {
    color: var(--gold);
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body class="app--ready">

<div class="auth">
  <div class="auth__brand">
    <span class="auth__brand-mark">Forge</span>
  </div>
  <div class="auth__title">Sign in</div>
  <div class="auth__sub">Use your email and password to continue.</div>

  <form id="loginForm" autocomplete="on">
    <div class="auth__field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    </div>
    <div class="auth__field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="auth__submit" id="submit">Sign in</button>
    <div class="auth__error" id="error"></div>
  </form>

  <div class="auth__hint">
    Forgot your password? Reset it from the terminal:<br>
    <code style="display:block;margin-top:8px;padding:8px 10px;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5">node scripts/create-user.js --password "new-password"</code>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submit');
  const errEl = document.getElementById('error');
  // Only a same-origin path may be the post-login destination. The server
  // builds `next` from the request path, which always starts with a single
  // "/"; anything else ("//evil", "javascript:", "http:") is a crafted link
  // and goes home instead.
  const rawNext = new URLSearchParams(location.search).get('next') || '/';
  const next = /^\/(?![\/\\])/.test(rawNext) ? rawNext : '/';

  // First run: nothing to sign in as until /setup has created the user.
  fetch('/api/setup').then(r => r.json()).then(d => {
    if (d && d.setupRequired) location.href = '/setup';
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json();
      // A database with no user yet has nothing to sign in as — go create one.
      if (r.status === 409 && data.setupRequired) {
        location.href = '/setup';
        return;
      }
      if (!r.ok) {
        errEl.textContent = data.error || 'Sign-in failed';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        return;
      }
      location.href = next;
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
