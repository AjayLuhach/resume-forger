  // ── Re-analyze imported rows ──
  // A row pulled in by the peer sync carries the peer's verdict/score, which
  // say nothing about how well the job fits ME. POST /api/apply/jobs/reanalyze
  // re-runs the scanner's analysis on the stored jobText against the signed-in
  // user's profile; the server clears `importedFrom` when it writes the fresh
  // analysis, so the pill and the Imported block vanish on the next reload.
  const REANALYZE_BATCH = 10;   // server caps a call at 50; 10 keeps each round-trip short
  let reanalyzeRunning = false;

  async function reanalyzeLinks(jobLinks) {
    const r = await fetch('/api/apply/jobs/reanalyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobLinks }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    return Array.isArray(d.results) ? d.results : [];
  }

  // Details-panel button: one row. The button stays disabled on success —
  // the reload that follows replaces the whole panel with the fresh analysis.
  async function reanalyzeOne(btn) {
    const jobLink = btn.dataset.link;
    if (!jobLink || btn.disabled) return;
    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Re-analyzing…';
    try {
      const results = await reanalyzeLinks([jobLink]);
      const res = results.find(x => x.jobLink === jobLink) || results[0];
      if (!res || !res.ok) throw new Error(res?.error || 'no result for this row');
      toastOutbox(`Re-analyzed against your profile: ${res.verdict || '?'}${res.score != null ? ` · ${res.score}/10` : ''}`);
      scheduleReload();
    } catch (e) {
      toastOutbox('Re-analyze failed: ' + e.message);
      btn.disabled = false;
      btn.textContent = prev;
    }
  }

  const importedRows = () => currentItems.filter(j => j.importedFrom);

  // Toolbar button label = how many LOADED rows are still imported. Hidden
  // when there are none; left alone mid-run so the progress label survives
  // the SSE-driven reloads each server write triggers.
  function renderReanalyzeButton() {
    const btn = document.getElementById('reanalyzeImportedBtn');
    const lab = document.getElementById('reanalyzeImportedLabel');
    if (!btn || !lab || reanalyzeRunning) return;
    const n = importedRows().length;
    btn.style.display = n ? '' : 'none';
    lab.textContent = `Re-analyze imported (${n})`;
  }

  async function startReanalyzeImported() {
    if (reanalyzeRunning) return;
    const links = importedRows().map(j => j.jobLink).filter(Boolean);
    if (!links.length) { renderReanalyzeButton(); return; }
    if (!confirm(
      `Re-analyze ${links.length} imported job(s) against your profile?\n\n` +
      `Each one is a model call. The peer's verdict and score are replaced by your own.`,
    )) return;
    const btn = document.getElementById('reanalyzeImportedBtn');
    const lab = document.getElementById('reanalyzeImportedLabel');
    reanalyzeRunning = true;
    btn.disabled = true;
    let done = 0, ok = 0, failed = 0, firstError = '';
    try {
      for (let i = 0; i < links.length; i += REANALYZE_BATCH) {
        const batch = links.slice(i, i + REANALYZE_BATCH);
        lab.textContent = `Re-analyzing ${done}/${links.length}…`;
        let results;
        try {
          results = await reanalyzeLinks(batch);
        } catch (e) {
          // A failed round-trip fails the whole batch; keep going with the
          // next one rather than abandoning the run halfway.
          results = batch.map(jobLink => ({ jobLink, ok: false, error: e.message }));
        }
        for (const res of results) {
          if (res.ok) ok++;
          else { failed++; if (!firstError) firstError = res.error || 'failed'; }
        }
        done += batch.length;
        lab.textContent = `Re-analyzing ${done}/${links.length}…`;
      }
    } finally {
      reanalyzeRunning = false;
      btn.disabled = false;
    }
    toastOutbox(failed
      ? `Re-analyzed ${ok}/${links.length} — ${failed} failed (${firstError})`
      : `Re-analyzed ${ok} job(s) against your profile`);
    scheduleReload();
  }

  // ── Batch tailoring ──
  // `tailorResults` is jobId → the newest tailored variant's summary (score,
  // model, variantId). `tailorRunItems` is jobId → live per-job state while a
  // run is in flight; it wins over `tailorResults` in the pill so a row shows
  // "···" the moment its turn comes up rather than staying blank for minutes.
  let tailorResults = {};
  let tailorRunItems = {};
  let tailorRunId = null;
  let tailorPollTimer = null;

  async function loadTailorResults() {
    try {
      const r = await fetch('/api/apply/tailor/results');
      const d = await r.json();
      if (r.ok) tailorResults = d.results || {};
    } catch { /* pills just don't render */ }
  }

  // How many pending jobs still have no resume — drives the button's label so
  // the cost of a click is visible before making it.
  async function loadTailorQueue() {
    const btn = document.getElementById('tailorResumesBtn');
    const label = document.getElementById('tailorResumesLabel');
    if (!btn || !label || tailorRunId) return;
    try {
      const r = await fetch('/api/apply/tailor/queue');
      const d = await r.json();
      if (!r.ok) return;
      label.textContent = d.count ? `✦ Tailor ${d.count} resume${d.count === 1 ? '' : 's'}` : '✦ All tailored';
      btn.disabled = !d.count;
    } catch { /* leave the default label */ }
  }

  async function startTailorRun() {
    const btn = document.getElementById('tailorResumesBtn');
    if (tailorRunId) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/apply/tailor/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      tailorRunId = d.runId;
      toastOutbox(`Tailoring ${d.total} resume(s) via ${d.provider}/${d.model}`);
      pollTailorRun();
    } catch (e) {
      toastOutbox('Tailoring failed to start: ' + e.message);
      btn.disabled = false;
    }
  }

  // Poll rather than stream: a run is minutes long and the page must survive a
  // reload mid-run, which an SSE connection tied to the click would not.
  function pollTailorRun() {
    clearTimeout(tailorPollTimer);
    tailorPollTimer = setTimeout(async () => {
      try {
        const r = await fetch(`/api/apply/tailor/run/${tailorRunId}`);
        const run = await r.json();
        if (!r.ok) throw new Error(run.error || r.status);

        tailorRunItems = {};
        for (const it of run.items || []) tailorRunItems[it.jobId] = it;

        const label = document.getElementById('tailorResumesLabel');
        if (label) label.textContent = `✦ ${run.done}/${run.total}${run.failed ? ` · ${run.failed} failed` : ''}`;

        // Newly-finished rows need their score, so refresh the result map each
        // tick; it's a single mirror-free Mongo query and the run is short-lived.
        await loadTailorResults();
        renderRows();

        if (run.status === 'running') { pollTailorRun(); return; }

        tailorRunId = null;
        tailorRunItems = {};
        const failed = (run.items || []).filter(i => i.status === 'failed');
        toastOutbox(failed.length
          ? `Tailored ${run.ok}/${run.total} — ${failed.length} failed (${failed[0].company}: ${failed[0].error})`
          : `Tailored ${run.ok} resume(s) — check ~/Downloads/a-tailored-resumes/`);
        renderRows();
        loadTailorQueue();
      } catch (e) {
        tailorRunId = null;
        tailorRunItems = {};
        toastOutbox('Lost track of the tailoring run: ' + e.message);
        document.getElementById('tailorResumesBtn').disabled = false;
        loadTailorQueue();
      }
    }, 2500);
  }

  // Read the tailored resume in place — the point being to check what the
  // model actually claimed before uploading the PDF anywhere.
  async function showResumeViewer(variantId) {
    const overlay = document.getElementById('resumeOverlay');
    const panel = document.getElementById('resumePanel');
    overlay.style.display = 'flex';
    panel.innerHTML = '<div class="resume-modal__body">Loading…</div>';
    try {
      const r = await fetch(`/api/apply/tailor/variant/${encodeURIComponent(variantId)}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);

      // Shape comes straight from services/pipeline/ats-scorer.js.
      const s = d.atsScore || {};
      const total = Number.isFinite(s.overallScore) ? s.overallScore : null;
      const scoreLine = [
        total != null ? `<b>${total}</b> ATS` : '',
        Number.isFinite(s.keywordExact) ? `· ${s.keywordExact}% keywords (${(s.found || []).length}/${s.totalKeywords ?? '?'})` : '',
        s.hardReject ? `· <span style="color:var(--ember)">hard reject: ${esc(s.rejectReason || '')}</span>` : '',
        d.model ? `· ${esc(d.model)}` : '',
        d.mode ? `· ${esc(d.mode)}` : '',
        d.generatedAt ? `· ${new Date(d.generatedAt).toLocaleString()}` : '',
      ].filter(Boolean).join(' ');

      const penalties = (s.penalties || []).map(p => `<div class="red-flag-item">${esc(p)}</div>`).join('');
      const found = (s.found || []);
      const missing = (s.missing || []);
      const bullets = (d.bullets || []).map(b => `<li>${esc(b)}</li>`).join('');
      const projects = (d.projects || []).filter(p => p.description)
        .map(p => `<div style="margin-bottom:8px"><b style="color:var(--ink-2)">${esc(p.name)}</b><br>${esc(p.description)}</div>`).join('');

      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
          <div>
            <div style="font:600 17px/1.3 var(--sans);color:var(--ink-1)">${esc(d.role || '')}</div>
            <div style="font:400 13px/1.4 var(--sans);color:var(--ink-3)">${esc(d.company || '')}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            ${d.hasLocalPdf
              ? `<a class="filter-btn" href="/api/apply/tailor/variant/${encodeURIComponent(d.variantId)}/pdf" target="_blank" rel="noopener">Open PDF</a>`
              : d.pdfName
                ? `<a class="filter-btn" href="/api/resumes/${encodeURIComponent(d.pdfName)}" target="_blank" rel="noopener">Open PDF</a>`
                : `<span style="font:400 12px/1 var(--sans);color:var(--ink-3)">PDF retired</span>`}
            <button class="filter-btn" data-close-resume>Close</button>
          </div>
        </div>
        <div class="resume-modal__score" style="margin-top:14px">${scoreLine}</div>
        ${penalties ? `<div class="resume-modal__h">Penalties</div>${penalties}` : ''}
        ${found.length ? `<div class="resume-modal__h">Keywords hit</div><div>${found.map(k => `<span class="skill-tag" data-kind="match">${esc(k)}</span>`).join('')}</div>` : ''}
        ${missing.length ? `<div class="resume-modal__h">Keywords still missing</div><div>${missing.map(k => `<span class="skill-tag" data-kind="missing">${esc(k)}</span>`).join('')}</div>` : ''}
        <div class="resume-modal__h">Headline</div><div class="resume-modal__body">${esc(d.title || '—')}</div>
        <div class="resume-modal__h">Summary</div><div class="resume-modal__body">${esc(d.summary || '—')}</div>
        <div class="resume-modal__h">Skills</div><div class="resume-modal__body">${esc(d.skills || '—')}</div>
        <div class="resume-modal__h">Current-role bullets</div><div class="resume-modal__body"><ul>${bullets || '<li>—</li>'}</ul></div>
        ${projects ? `<div class="resume-modal__h">Projects</div><div class="resume-modal__body">${projects}</div>` : ''}
      `;
    } catch (e) {
      panel.innerHTML = `<div class="resume-modal__body">Could not load that resume: ${esc(e.message)}<br><br><button class="filter-btn" data-close-resume>Close</button></div>`;
    }
  }

  let _outboxToastTimer = null;
  function toastOutbox(msg) {
    let el = document.getElementById('outboxToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'outboxToast';
      el.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;'
        + 'background:var(--bg-2,#1b1b1b);color:var(--ink-1,#eee);border:1px solid var(--gold-line,#8a6d3b);'
        + 'border-radius:8px;padding:8px 14px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.45);';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(_outboxToastTimer);
    _outboxToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2600);
  }

  async function parseClipboard() {
    const btn = document.getElementById('parseClipboardBtn');
    const status = document.getElementById('applyStatus');
    btn.disabled = true;
    status.textContent = 'Reading clipboard…';
    status.dataset.tone = '';
    try {
      const r = await fetch('/api/apply/parse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const data = await r.json();
      if (!r.ok) {
        status.textContent = data.error || 'Parse failed';
        status.dataset.tone = 'err';
      } else {
        status.textContent = `Saved ${data.inserted} new · ${data.refreshed} refreshed (${data.format})`;
        status.dataset.tone = 'ok';
        await Promise.all([loadJobs(), loadStats()]);
        renderAll();
      }
    } catch (e) {
      status.textContent = e.message;
      status.dataset.tone = 'err';
    } finally {
      btn.disabled = false;
      setTimeout(() => { status.textContent = ''; status.dataset.tone = ''; }, 8000);
    }
  }

  function renderMeta() {
    // "Showing X of Y matching" makes the page-size cap obvious without
    // the user having to scroll. Y is the total across every active filter
    // (status + verdict + platform + search), not just the visible page.
    const ofTotal = totalMatching > currentItems.length
      ? ` of ${totalMatching}`
      : '';
    document.getElementById('resultsMeta').textContent =
      `${currentItems.length}${ofTotal} jobs · signed in as ${me}`;
  }

  function renderPills(rootId, options, currentValue, onPick) {
    const root = document.getElementById(rootId);
    root.innerHTML = options.map(([val, label]) =>
      `<button class="filter-btn ${currentValue === val ? 'active' : ''}" data-val="${esc(val)}">${esc(label)}</button>`,
    ).join('');
    root.querySelectorAll('.filter-btn').forEach(b => {
      b.addEventListener('click', async () => { await onPick(b.dataset.val); });
    });
  }

  function renderPlatformPills() {
    renderPills('applyPlatformPills',
      [['', 'All platforms'], ['LinkedIn', 'LinkedIn'], ['Naukri', 'Naukri']],
      platform,
      async (v) => { platform = v; await Promise.all([loadJobs(), loadStats()]); renderAll(); },
    );
  }

  function renderStatusPills() {
    renderPills('applyStatusPills',
      [
        ['',             'All statuses'],
        ['pending',      'Pending'],
        ['applied',      'Applied'],
        ['interviewing', 'Interviewing'],
        ['success',      'Success'],
        ['rejected',     'Rejected'],
      ],
      statusFilter,
      async (v) => { statusFilter = v; await loadJobs(); renderAll(); },
    );
  }

  // Toggle pill that flips hasContactFilter. Single button so the click is
  // an on/off rather than a radio choice — the alternative ('Any contact')
  // is the implicit default state.
  function renderContactPills() {
    renderPills('applyContactPills',
      [['1', 'Has contact']],
      hasContactFilter ? '1' : '',
      async () => { hasContactFilter = !hasContactFilter; await loadJobs(); renderAll(); },
    );
  }

  // Convenience: re-fetch the current page + stats + re-render.
  async function reload() {
    await Promise.all([loadJobs(), loadStats()]);
    renderAll();
  }

  // Server-Sent Events: server notifies us when the mirror changes
  // (a local write, or a row absorbed by the mirror — e.g. a peer import).
  // We debounce rapid bursts of events into a single reload so a
  // bulk import doesn't trigger 200 refetches.
  let _reloadTimer = null;
  const scheduleReload = () => {
    clearTimeout(_reloadTimer);
    _reloadTimer = setTimeout(() => reload(), 600);
  };
  try {
    const es = new EventSource('/api/events');
    es.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        // Apply page cares about job_tracker (rows) and connections
        // (the refs popover). Ignore feed-only collections.
        if (d.collection === 'job_tracker' || d.collection === 'connections') {
          scheduleReload();
        }
      } catch {}
    };
    es.onerror = () => { /* browser auto-reconnects */ };
  } catch { /* SSE unsupported — fall back to manual refresh */ }

  function renderAll() {
    renderPlatformPills();
    renderStatusPills();
    renderContactPills();
    // Toggle the status column: when the page is filtered to one status
    // (Pending / Applied / etc.) every row shows the same pill, so the
    // column is just noise. Hide it via CSS class to keep the layout
    // logic flat.
    const table = document.querySelector('.apply-table');
    if (table) table.classList.toggle('no-status-col', !!statusFilter);
    renderHead();
    renderMeta();
    renderStats();
    renderRows();
    renderLoadMore();
    renderReanalyzeButton();
  }

  document.getElementById('loadMoreBtn').addEventListener('click', async () => {
    const btn = document.getElementById('loadMoreBtn');
    btn.disabled = true;
    btn.textContent = 'Loading…';
    try {
      await loadMoreJobs();
      renderRows();
      renderLoadMore();
      renderReanalyzeButton();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Load more';
    }
  });

  async function copyLinks() {
    const status = document.getElementById('copyLinksStatus');
    let links = currentItems.map(j => j.jobLink).filter(Boolean);
    // Optional cap. Blank / 0 / NaN / negative all mean "no cap".
    const rawCap = document.getElementById('copyLinksLimit')?.value;
    const cap = Number.parseInt(rawCap, 10);
    const capped = Number.isFinite(cap) && cap > 0 && cap < links.length;
    if (capped) links = links.slice(0, cap);
    if (!links.length) {
      status.textContent = 'No links to copy'; status.dataset.tone = 'err';
      setTimeout(() => { status.textContent = ''; status.dataset.tone = ''; }, 3000);
      return;
    }
    const text = links.join(' ');
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = capped
        ? `Copied ${links.length} link${links.length === 1 ? '' : 's'} (capped from ${currentItems.length})`
        : `Copied ${links.length} link${links.length === 1 ? '' : 's'}`;
      status.dataset.tone = 'ok';
    } catch (e) {
      status.textContent = 'Clipboard blocked — ' + (e.message || 'use HTTPS or grant permission');
      status.dataset.tone = 'err';
    }
    setTimeout(() => { status.textContent = ''; status.dataset.tone = ''; }, 4000);
  }

  // ──────────────────────────────────────────────────────────────────────
  // ── Rescan score-1 jobs ────────────────────────────────────────────────
  // A scanner score of 1 is usually not a verdict, it's a failed scrape: the
  // job description hadn't rendered when the extension ran, so it graded a
  // near-empty page. Distinct from the LI-count rescan above — that one opens
  // COMPANY pages for headcount; this opens the JOB pages themselves.
  //
  // The cached verdict has to be cleared first. content.js treats a 200 from
  // /api/ext/result/:jobId as a cache hit and skips analysis; clear-scan
  // $unsets verdict (and jobText), which makes that endpoint 404 and pushes
  // content.js down its full-scan path.
  // Measured on this dataset: every score-1 row landed between 1551 and 1618
  // characters — the LinkedIn page shell with no job body — while every score
  // 2+ row carried 3557+. 2000 separates the two cleanly with room either way.
  const THIN_TEXT_CHARS = 2000;

  let scoreRescanQueue = [];
  let scoreRescanRunning = false;

  async function loadScoreRescanCount() {
    try {
      const r = await fetch('/api/apply/jobs/low-score?maxScore=1&limit=500');
      if (!r.ok) return;
      const d = await r.json();
      const btn = document.getElementById('rescanScoreBtn');
      const lab = document.getElementById('rescanScoreLabel');
      if (!d.count) { btn.style.display = 'none'; return; }
      btn.style.display = '';
      const thin = d.jobs.filter(j => j.jobTextLen < THIN_TEXT_CHARS).length;
      lab.textContent = `Rescan score-1 (${d.count}${thin ? ` · ${thin} thin` : ''})`;
    } catch {}
  }

  async function startScoreRescan() {
    if (scoreRescanRunning) return;
    const lab = document.getElementById('rescanScoreLabel');
    const r = await fetch('/api/apply/jobs/low-score?maxScore=1&limit=500');
    if (!r.ok) return;
    const d = await r.json();
    if (!d.count) { await loadScoreRescanCount(); return; }

    const thin = d.jobs.filter(j => j.jobTextLen < THIN_TEXT_CHARS);
    const pick = thin.length ? thin : d.jobs;
    if (!confirm(
      `Re-scan ${pick.length} job(s) scored 1?\n\n` +
      (thin.length
        ? `These ${thin.length} captured under ${THIN_TEXT_CHARS} chars — the page shell without the job body, i.e. the scrape ran before the description rendered.\n`
        : `All of these carry a full job description, so the low score looks genuine rather than a failed scrape.\n`) +
      `\nTheir cached verdict will be cleared and each job page re-opened (1 every 2-4 s) for the extension to analyse.`
    )) return;

    lab.textContent = 'Clearing cached verdicts…';
    try {
      await fetch('/api/apply/jobs/clear-scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobLinks: pick.map(j => j.jobLink) }),
      });
    } catch { lab.textContent = 'Could not clear verdicts'; return; }

    scoreRescanQueue = pick.map(j => ({ url: j.jobLink, label: j.company || j.title || j.jobLink }));
    scoreRescanTotal = scoreRescanQueue.length;
    scoreRescanRunning = true;
    runScoreRescanLoop();
  }

  let scoreRescanTotal = 0;

  // Paced the same way as the LI rescan: one tab at a time with a visible
  // countdown, so a queue of 50 doesn't look like a popup flood.
  async function runScoreRescanLoop() {
    const lab = document.getElementById('rescanScoreLabel');
    if (!scoreRescanRunning) { lab.textContent = 'Rescan stopped'; return; }
    const next = scoreRescanQueue.shift();
    if (!next) {
      scoreRescanRunning = false;
      lab.textContent = `Re-scanned ${scoreRescanTotal} — refreshing…`;
      setTimeout(async () => { await reload(); await loadScoreRescanCount(); }, 8000);
      setTimeout(async () => { await reload(); await loadScoreRescanCount(); }, 25000);
      return;
    }
    const done = scoreRescanTotal - scoreRescanQueue.length;
    lab.textContent = `Rescanning ${done}/${scoreRescanTotal}: ${String(next.label).slice(0, 24)}`;
    window.open(next.url, '_blank', 'noopener');
    let wait = 2 + Math.floor(Math.random() * 3);
    const tick = setInterval(() => {
      if (!scoreRescanRunning) { clearInterval(tick); return; }
      lab.textContent = `${done}/${scoreRescanTotal} · next in ${wait}s…`;
      if (--wait <= 0) { clearInterval(tick); runScoreRescanLoop(); }
    }, 1000);
  }

  // Rescan-missing-LI-count button — server returns the list of LinkedIn
  // rows missing employeesOnLinkedIn (scraper ran too early, or row was
  // imported as a stub and never analyzed). Click opens those URLs one at
  // a time, 2-3 s gap, so the extension can re-scrape at a human-ish pace.
  // Re-run mechanic: startRescan() POSTs /api/apply/jobs/clear-scan first,
  // which $unsets verdict + companyDetails on the row. The extension's
  // content.js then hits /api/ext/result/:jobId, which returns 404 when
  // verdict is missing (see services/ext-api/router.js) — that 404 is what
  // makes content.js fall into its full-scan path instead of treating the
  // stub as a cache hit.
  // ──────────────────────────────────────────────────────────────────────
  let rescanQueue = [];   // remaining jobLink objects this run
  let rescanRunning = false;

  // The server scopes this to the signed-in user's pending rows.
  const missingLiUrl = '/api/apply/jobs/missing-li-count?limit=500';

  async function loadRescanCount() {
    try {
      const r = await fetch(missingLiUrl);
      if (!r.ok) return;
      const data = await r.json();
      const btn = document.getElementById('rescanLiBtn');
      const lab = document.getElementById('rescanLiLabel');
      // Count the COMPANIES this will open, not the rows. Rescan dedupes by
      // company and skips rows with no captured URL, so a row count promised
      // seven tabs where four would open.
      const openable = buildRescanOpenList(data.jobLinks || []).opens.length;
      if (!openable) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = '';
      lab.textContent = `Rescan missing LI count (${openable})`;
      btn.dataset.count = String(openable);
    } catch {}
  }

  // Smoke-test: open the first caught company page from the missing set.

  // Normalize any stored company URL to the /people/ tab (which renders the headcount band) + #fgcap so the extension may auto-close it. Null if no URL.
  function canonCompanyUrl(u) {
    const m = (u || '').match(/\/company\/([^/?#]+)/i);
    return m ? `https://www.linkedin.com/company/${m[1].toLowerCase()}/people/#fgcap` : null;
  }

  // One deduped /people/ tab per company we have a caught URL for; rows without one are skipped (the job page won't surface a URL it never had).
  function buildRescanOpenList(rows) {
    const seenCompany = new Set();
    const opens = [];
    let skipped = 0;
    for (const row of rows) {
      const cu = canonCompanyUrl(row.companyLinkedIn);
      if (!cu) { skipped++; continue; }
      if (seenCompany.has(cu)) continue;
      seenCompany.add(cu);
      opens.push({ url: cu, kind: 'company', label: row.company || cu });
    }
    return { opens, skipped };
  }

  async function startRescan() {
    if (rescanRunning) return;
    const r = await fetch(missingLiUrl);
    if (!r.ok) return;
    const data = await r.json();
    if (!data.count) { await loadRescanCount(); return; }

    // Backfill from peers first — copy a count we already hold for the same company instead of opening a tab.
    const lab = document.getElementById('rescanLiLabel');
    lab.textContent = 'Backfilling from existing scans…';
    // Backfill returns slim stubs; re-join to keep each row's companyLinkedIn.
    const byLink = new Map(data.jobLinks.map(j => [j.jobLink, j]));
    let queue = data.jobLinks;
    try {
      const bf = await fetch('/api/apply/jobs/backfill-li-count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobLinks: data.jobLinks.map(j => j.jobLink) }),
      });
      if (bf.ok) {
        const bd = await bf.json();
        if (Array.isArray(bd.remainingJobLinks)) {
          queue = bd.remainingJobLinks.map(q => byLink.get(q.jobLink) || q);
        }
        if (bd.filled) lab.textContent = `Backfilled ${bd.filled} · ${queue.length} need a live rescan`;
      }
    } catch { /* fall through to rescanning the full set */ }

    // Everything satisfied from our own data — no tabs to open.
    if (!queue.length) {
      const btn = document.getElementById('rescanLiBtn');
      btn.dataset.toast = 'ok';
      lab.textContent = `Backfilled all ${data.count} from existing data`;
      setTimeout(async () => { await reload(); await loadRescanCount(); delete btn.dataset.toast; }, 6000);
      return;
    }

    const { opens, skipped } = buildRescanOpenList(queue);
    if (!opens.length) {
      lab.textContent = 'Rescan missing LI count — none have a company URL';
      return;
    }
    if (!confirm(
      `Open ${opens.length} company page(s) (1 every 1-3 s)?\n\n` +
      `Headcount-only, no job-page hit.${skipped ? ` ${skipped} row(s) skipped — no company URL.` : ''}`
    )) { lab.textContent = `Rescan missing LI count (${opens.length})`; return; }

    rescanQueue = opens.slice();
    rescanTotal = rescanQueue.length;
    rescanRunning = true;
    runRescanLoop();
  }

  // Mirrors the old job-scanner dashboard's rescan UX exactly: opens each
  // URL, then runs a 1-3 second countdown ("next in Xs…") in the button
  // label so the user can see we're paced. After the queue drains we
  // refresh the apply page list twice (8 s + 25 s) — re-scanned rows
  // need a moment to land on the server before they show as populated.
  let rescanTotal = 0;

  async function runRescanLoop() {
    const btn = document.getElementById('rescanLiBtn');
    const lab = document.getElementById('rescanLiLabel');
    if (!rescanRunning) { lab.textContent = 'Rescan stopped'; return; }
    const next = rescanQueue.shift();
    if (!next) {
      rescanRunning = false;
      lab.textContent = `Done — ${rescanTotal} reopened`;
      btn.dataset.toast = 'ok';
      setTimeout(async () => { await reload(); await loadRescanCount(); }, 8000);
      setTimeout(async () => { await reload(); await loadRescanCount(); delete btn.dataset.toast; }, 25000);
      return;
    }
    // Just open the tab. `noopener` makes window.open return null on a
    // successful open too (browser spec), so any null-check based "popup
    // blocked" detection would false-positive on every iteration.
    window.open(next.url, '_blank', 'noopener');
    const doneSoFar = rescanTotal - rescanQueue.length;
    btn.dataset.toast = '';
    btn.title = '';

    // Countdown — 1 to 3 s random, updated every second in the label.
    const delaySec = 1 + Math.floor(Math.random() * 3);
    for (let remain = delaySec; remain > 0; remain--) {
      if (!rescanRunning) return;
      lab.textContent = `Rescanning ${doneSoFar}/${rescanTotal} · next in ${remain}s…`;
      await new Promise(r => setTimeout(r, 1000));
    }
    runRescanLoop();
  }

  function stopRescan() {
    rescanRunning = false;
    rescanQueue = [];
  }

  // listeners
  document.getElementById('parseClipboardBtn').addEventListener('click', parseClipboard);
  document.getElementById('copyLinksBtn').addEventListener('click', copyLinks);
  document.getElementById('rescanLiBtn').addEventListener('click', () => {
    if (rescanRunning) stopRescan();
    else startRescan();
  });
  document.getElementById('applySearch').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(async () => { await reload(); }, 250);
  });
  document.getElementById('applySortSelect').addEventListener('change', async (e) => {
    sortKey = e.target.value;
    await reload();
  });

  // Auto-expand-next-on-reject checkbox: state survives reloads.
  const _autoExpKey = 'apply.autoExpandFirstOnReject';
  document.getElementById('sortResumesBtn')?.addEventListener('click', reorderOutbox);
  document.getElementById('rescanScoreBtn')?.addEventListener('click', startScoreRescan);
  document.getElementById('tailorResumesBtn')?.addEventListener('click', startTailorRun);
  document.getElementById('reanalyzeImportedBtn')?.addEventListener('click', startReanalyzeImported);

  // ATS pill → resume viewer, and the viewer's own close affordances.
  // Delegated so it survives every renderRows() rewrite of the tbody.
  document.addEventListener('click', (e) => {
    const pill = e.target.closest('.ats-pill[data-variant]');
    if (pill) { e.stopPropagation(); showResumeViewer(pill.dataset.variant); return; }
    if (e.target.closest('[data-close-resume]')) {
      document.getElementById('resumeOverlay').style.display = 'none';
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const o = document.getElementById('resumeOverlay');
    if (o && o.style.display !== 'none') o.style.display = 'none';
  });

  const _autoExpChk = document.getElementById('autoExpandFirstChk');
  if (_autoExpChk) {
    try { _autoExpChk.checked = localStorage.getItem(_autoExpKey) === '1'; } catch {}
    _autoExpChk.addEventListener('change', () => {
      try { localStorage.setItem(_autoExpKey, _autoExpChk.checked ? '1' : '0'); } catch {}
    });
  }

  // boot
  (async () => {
    try {
      await loadUsers();
      await Promise.all([loadJobs(), loadStats(), loadRescanCount(), loadScoreRescanCount(), loadTailorResults()]);
      renderAll();
      loadTailorQueue();
    } catch (e) {
      document.getElementById('resultsMeta').textContent = 'Failed to load: ' + e.message;
    }
  })();

  // Manual refresh button. Delegated off document so it works regardless
  // of whether the <button> element is parsed before or after this IIFE
  // runs (it currently sits after the closing script tag in the file).
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('#refreshBtn');
    if (!btn) return;
    btn.classList.add('spinning');
    try { await reload(); }
    finally { btn.classList.remove('spinning'); }
  });
})();
</script>

<!-- Tailored-resume viewer. Opened by clicking a row's ATS pill; filled by
